name: DevSecOps Avançado

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast-zap:
    name: DAST com OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build e sobe a aplicação com Docker
        run: |
          docker build -t verbum-academy:ci .
          docker run -d --name verbum-app -p 8000:8000 verbum-academy:ci
          echo "Aguardando a aplicação ficar disponível..."
          for i in $(seq 1 50); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "Aplicação no ar!"
              break
            fi
            echo "Tentativa $i..."
            sleep 4
          done
          echo "=== Status da aplicação ==="
          curl -I http://localhost:8000/ || true
          echo "=== Logs do container ==="
          docker logs verbum-app || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:8000/'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-dast-report
          cmd_options: '-m 2 -T 5 -I'

      - name: Para a aplicação
        if: always()
        run: docker stop verbum-app || true

  bearer-privacy:
    name: Scanner de Privacidade com Bearer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bearer - Varredura de Privacidade e Dados Sensíveis (LGPD)
        uses: bearer/bearer-action@v2
        with:
          severity: 'high,critical'

  trivy-sbom:
    name: SBOM com Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar SBOM com Trivy (CycloneDX)
        uses: aquasecurity/trivy-action@0.27.0
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom.json'
          skip-dirs: 'docs,.git,.github'

      - name: Upload do artefato SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30
