name: DevSecOps Avançado

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast-zap:
    name: DAST com OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build e sobe a aplicação com Docker
        run: |
          docker build -t verbum-academy:ci .
          docker run -d --name verbum-app -p 8000:8000 verbum-academy:ci
          echo "Aguardando a aplicação ficar disponível..."
          for i in $(seq 1 50); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "Aplicação no ar!"
              break
            fi
            echo "Tentativa $i..."
            sleep 4
          done
          echo "=== Status da aplicação ==="
          curl -I http://localhost:8000/ || true
          echo "=== Logs do container ==="
          docker logs verbum-app || true

      - name: Prepara diretório para o ZAP
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          touch zap-reports/report.html zap-reports/report.json zap-reports/report.md
          chmod 666 zap-reports/*

      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v $(pwd)/zap-reports:/zap/wrk:rw \
            --user root \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8000/ \
            -r /zap/wrk/report.html \
            -J /zap/wrk/report.json \
            -w /zap/wrk/report.md \
            -I \
            || true
          echo "Scan do ZAP finalizado"

      - name: Upload relatório ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_dast_report
          path: zap-reports/

      - name: Para a aplicação
        if: always()
        run: docker stop verbum-app || true

  bearer-privacy:
    name: Scanner de Privacidade com Bearer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bearer - Varredura de Privacidade e Dados Sensíveis (LGPD)
        uses: bearer/bearer-action@v2
        with:
          severity: 'high,critical'

  trivy-sbom:
    name: SBOM com Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar SBOM com Trivy (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom.json'
          skip-dirs: 'docs,.git,.github'

      - name: Upload do artefato SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom_cyclonedx
          path: sbom.json
          retention-days: 30
