{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - VERBUM ACADEMY</title>
    <link rel="stylesheet" href="{% static 'css/verbum.css' %}">
</head>
<body class="register-page">
    <div class="auth-container">
        <a class="auth-brand" href="{% url 'homePage' %}"> VERBUM ACADEMY </a>
        <main class="register-card">
            <header class="register-header">
                <h1>Criar conta</h1>
                <p>Comece agora sua jornada de aprendizagem.</p>
            </header>
            {% if error %}
                <div class="register-message register-error" role="alert">
                    {{ error }}
                </div>
            {% endif %}
            {% if success %}
                <div class="register-message register-success" role="status">
                    {{ success }}
                </div>
            {% endif %}
            <form method="post" class="register-form">
                {% csrf_token %}
                <div class="register-field">
                    <label for="username">Usuário</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>
                <div class="register-field">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="exemplo@email.com"
                        required
                    >
                </div>
                <div class="register-field">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>
                <div class="register-field">
                    <label for="password_confirmation">
                        Confirme sua senha
                    </label>
                    <input
                        type="password"
                        id="password_confirmation"
                        name="password_confirmation"
                        autocomplete="new-password"
                        placeholder="Digite a senha novamente"
                        required
                    >
                </div>
                <div class="register-field">
                    <label>
                        <input type="checkbox" name="consent" value="1">
                        Li e aceito a
                        <a href="{% url 'politica_privacidade' %}" target="_blank" rel="noopener">
                            Política de Privacidade v1.0
                        </a>
                        para criar e gerenciar minha conta no Verbum.
                    </label>
                </div>
                <button type="submit" class="register-button">
                    Cadastrar
                </button>
            </form>
            <p class="auth-switch">
                Já tem uma conta?
               <a href="{% url 'homePage' %}">Entrar</a>
            </p>
        </main>
    </div>
</body>
</html>
