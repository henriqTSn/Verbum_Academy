{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-mail enviado | VERBUM</title>

    <link rel="stylesheet" href="{% static 'css/verbum.css' %}">
</head>

<body class="password-reset-page">

    <main class="auth-container">

        <a class="auth-brand" href="{% url 'login' %}">
            VERBUM
        </a>

        <section
            class="login-card password-reset-card"
            aria-labelledby="email-sent-title"
        >

            <p class="tag">RECUPERAÇÃO DE SENHA</p>

            <h2 id="email-sent-title">
                Verifique seu e-mail
            </h2>

            <p class="subtext">
                Se o e-mail informado estiver cadastrado,
                enviaremos instruções para redefinir sua senha.
            </p>

            <p class="register">
                <a href="{% url 'login' %}">
                    Voltar para o login
                </a>
            </p>

        </section>

    </main>

</body>
</html>
