{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Senha alterada | VERBUM ACADEMY</title>

    <link rel="stylesheet" href="{% static 'css/verbum.css' %}">
</head>

<body class="password-reset-page">

    <main class="auth-container">

        <a class="auth-brand" href="{% url 'login' %}"> VERBUM ACADEMY</a>

        <section
            class="login-card password-reset-card"
            aria-labelledby="password-changed-title"
        >

            <p class="tag">SENHA ALTERADA</p>

            <h2 id="password-changed-title">
                Senha redefinida com sucesso!
            </h2>

            <p class="subtext">
                Sua senha foi alterada. Agora você já pode
                acessar sua conta utilizando a nova senha.
            </p>

            <p class="register">
                <a href="{% url 'login' %}">
                    Voltar para o login
                </a>
            </p>

        </section>

    </main>

</body>
</html>
